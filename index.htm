<style>
/* calc(var(--u)*1) = 1 pixel of the 1079px-wide reference screenshot, scaled to fit any phone screen (width AND height) */
:root{ --u: calc(min(100vw, 480px, 100vh * .5472) / 1079); }
@supports (height:100dvh){ :root{ --u: calc(min(100vw, 480px, 100dvh * .5472) / 1079); } }

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;color:#f5f5f5;
  background:radial-gradient(120% 70% at 50% 42%,#141414 0%,#0a0a0a 48%,#000 100%);
}
h1,h2,p{margin:0;font-weight:inherit}

.page{max-width:480px;height:100%;margin:0 auto}

/* top notice bar */
.banner{
  height:calc(var(--u)*245);background:#f5f5f5;color:#111;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:calc(var(--u)*38);line-height:calc(var(--u)*58);font-weight:700;white-space:nowrap;
}

/* stage = the rest of the screenshot */
.stage{position:relative;width:calc(var(--u)*1079);height:calc(var(--u)*1727);margin:0 auto;display:block}
.stage>*{position:absolute}
.t{left:0;width:100%;text-align:center;white-space:nowrap}

.title{top:calc(var(--u)*235);font-size:calc(var(--u)*80);line-height:calc(var(--u)*80);font-weight:800;letter-spacing:-.02em;animation:rise .8s ease .1s backwards}
.sub{top:calc(var(--u)*341.5);height:calc(var(--u)*53);display:flex;justify-content:center;align-items:center;gap:calc(var(--u)*14);font-size:calc(var(--u)*44);line-height:calc(var(--u)*53);color:#8e8e8e;animation:rise .8s ease .2s backwards}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:calc(var(--u)*44);line-height:1}
.tag{top:calc(var(--u)*1001);font-size:calc(var(--u)*43);line-height:calc(var(--u)*52);color:#9a9a9a;animation:rise .8s ease .5s backwards}
.brand{top:calc(var(--u)*1068);font-size:calc(var(--u)*53);line-height:calc(var(--u)*64);font-weight:700;letter-spacing:-.01em;animation:rise .8s ease .6s backwards}
.tap{top:calc(var(--u)*1147);height:calc(var(--u)*52);display:flex;justify-content:center;align-items:center;gap:calc(var(--u)*14);font-size:calc(var(--u)*43);line-height:calc(var(--u)*52);color:#9a9a9a;animation:rise .8s ease .7s backwards}
.dl{width:calc(var(--u)*45);height:calc(var(--u)*45);display:block;animation:down 1.4s ease-in-out 1.5s infinite}

/* profile photo */
.avatar{left:calc(var(--u)*315);top:calc(var(--u)*473);width:calc(var(--u)*450);height:calc(var(--u)*450);animation:pop .9s cubic-bezier(.2,.9,.3,1.15) .1s backwards}
.float{position:absolute;inset:0;animation:float 4.5s ease-in-out 1s infinite}
.float::before,.float::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  border:calc(var(--u)*3) solid rgba(255,255,255,.55);opacity:0;
  animation:ripple 3.4s ease-out 1.2s infinite;
}
.float::after{animation-delay:2.9s}
.photo{
  position:absolute;inset:0;border-radius:50%;overflow:hidden;
  border:calc(var(--u)*6) solid #2e2e2e;background:#0b0b0b;
  animation:glow 3.4s ease-in-out infinite;
}
.photo img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}
.halo{
  position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,0) 240deg,rgba(255,255,255,.95) 335deg,rgba(255,255,255,0) 360deg);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - calc(var(--u)*6)),#000 calc(100% - calc(var(--u)*5)));
          mask:radial-gradient(farthest-side,transparent calc(100% - calc(var(--u)*6)),#000 calc(100% - calc(var(--u)*5)));
  animation:spin 3s linear infinite;
}

/* join button */
.btn{
  left:calc(var(--u)*59);top:calc(var(--u)*1276);width:calc(var(--u)*960);height:calc(var(--u)*174);border-radius:999px;
  background:#f5f5f5;color:#0a0a0a;text-decoration:none;
  display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*37);
  font-size:calc(var(--u)*47);line-height:1;font-weight:700;white-space:nowrap;
  overflow:hidden;isolation:isolate;cursor:pointer;
  animation:rise .8s ease .85s backwards,btnpulse 2.4s ease-in-out 1.9s infinite;
}
.btn::before{
  content:"";position:absolute;top:0;bottom:0;left:0;width:35%;z-index:-1;
  background:linear-gradient(100deg,transparent,rgba(41,163,224,.32),transparent);
  transform:translateX(-150%) skewX(-20deg);
  animation:shine 3s ease-in-out 2s infinite;
}
.btn svg{width:calc(var(--u)*40);height:calc(var(--u)*40);flex:none;animation:nudge 1.2s ease-in-out infinite}
.btn:active{filter:brightness(.92)}
.btn:focus-visible{outline:calc(var(--u)*6) solid #fff;outline-offset:calc(var(--u)*8)}

@keyframes rise{from{opacity:0;transform:translateY(calc(var(--u)*24))}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--u)*-12))}}
@keyframes ripple{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.32);opacity:0}}
@keyframes glow{0%,100%{box-shadow:0 0 calc(var(--u)*30) rgba(255,255,255,.06)}50%{box-shadow:0 0 calc(var(--u)*70) rgba(255,255,255,.22)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes btnpulse{
  0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,.45)}
  70%{transform:scale(1.03);box-shadow:0 0 0 calc(var(--u)*26) rgba(255,255,255,0)}
  100%{transform:scale(1);box-shadow:0 0 0 calc(var(--u)*26) rgba(255,255,255,0)}
}
@keyframes shine{0%{transform:translateX(-150%) skewX(-20deg)}55%,100%{transform:translateX(330%) skewX(-20deg)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(calc(var(--u)*10))}}
@keyframes down{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--u)*6))}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important}
}
</style>
